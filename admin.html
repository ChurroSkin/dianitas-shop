<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Dashboard | Dianita's Shop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .dashboard { max-width: 1100px; margin: 40px auto; padding: 24px; background: white; border-radius: 18px; }
        .dashboard-header { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
        .order-list { display:grid; gap:16px; margin-top:24px; }
        .order-card { border:1px solid #eadcf7; border-radius:14px; padding:18px; }
        .order-meta { color:#666; font-size:.85rem; }
        .order-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
        .order-actions select, .order-actions button { width:auto; margin:0; }
        .reference-link { display:inline-block; margin-top:8px; }
        #login-panel { max-width:420px; margin:60px auto; background:white; padding:28px; border-radius:18px; }
        .dashboard button { padding:10px 18px; border:0; border-radius:22px; background:#9b59b6; color:white; cursor:pointer; }
        .dashboard button:disabled { opacity:.5; cursor:wait; }
    </style>
</head>
<body>
    <nav><a href="index.html"><img src="logo.png" alt="Dianita's Shop" class="nav-logo"></a><a href="index.html">View shop</a></nav>
    <main>
        <section id="login-panel">
            <h1>Shop Admin</h1>
            <p>Sign in to review customer requests.</p>
            <form id="login-form">
                <label for="admin-email">Email</label>
                <input id="admin-email" type="email" autocomplete="username" required>
                <label for="admin-password">Password</label>
                <input id="admin-password" type="password" autocomplete="current-password" required>
                <button type="submit">Sign in</button>
            </form>
            <p id="login-status" role="status"></p>
        </section>
        <section id="dashboard" class="dashboard" hidden>
            <div class="dashboard-header"><div><h1>Customer Orders</h1><p>Private order management</p></div><div><button id="refresh-orders">Refresh</button> <button id="sign-out">Sign out</button></div></div>
            <p id="dashboard-status" role="status"></p>
            <div id="order-list" class="order-list"></div>
        </section>
    </main>
    <script type="module" src="admin.js"></script>
</body>
</html>
